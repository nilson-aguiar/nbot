spring:
  application:
    name: nbot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nbot}
    username: ${SPRING_DATASOURCE_USERNAME:nbot}
    password: ${SPRING_DATASOURCE_PASSWORD:nbot_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


nbot:
  telegram:
    enabled: true
    allowed-users: ${ALLOWED_USERS:}
    telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
    dashboard-url: ${DASHBOARD_URL:http://localhost:8080}
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    allowed-numbers: ${WHATSAPP_ALLOWED_NUMBERS:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    api-token: ${WHATSAPP_API_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    dashboard-url: ${DASHBOARD_URL:http://localhost:8080}
  qbittorrent:
    url: ${QBITTORRENT_URL:http://localhost:8090}
    username: ${QBITTORRENT_USERNAME:admin}
    password: ${QBITTORRENT_PASSWORD:adminadmin}
  socialschools:
    url: ${SOCIALSCHOOLS_URL:}
    username: ${SOCIALSCHOOLS_USERNAME:}
    password: ${SOCIALSCHOOLS_PASSWORD:}
    login-url: ${SOCIALSCHOOLS_LOGIN_URL:}
    download-dir: ${SOCIALSCHOOLS_DOWNLOAD_DIR:}
  homepage:
    enabled: ${HOMEPAGE_K8S_ENABLED:true}
    cache-ttl-seconds: ${HOMEPAGE_CACHE_TTL_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,configprops

logging:
  level:
      dev.naguiar: DEBUG
