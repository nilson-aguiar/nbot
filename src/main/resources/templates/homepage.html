<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>nbot // Homelab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 0.5rem; }
        .service-card { background-color: #161b22; border: 1px solid #30363d; border-radius: 0.5rem; transition: border-color 0.15s ease, transform 0.15s ease; }
        .service-card:hover { border-color: #58a6ff; transform: translateY(-1px); }
    </style>
</head>
<body class="min-h-screen p-6 md:p-8">
    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <header class="card p-5 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-lg bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-blue-400 font-mono font-bold">
                    n
                </div>
                <div>
                    <h1 class="text-lg font-semibold text-gray-100">nbot Homelab</h1>
                    <p class="text-xs text-gray-400">Discovered cluster IngressRoutes grouped by namespace</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <div class="relative flex-grow md:w-64">
                    <input
                        id="service-search"
                        type="search"
                        placeholder="Filter services or namespaces..."
                        oninput="filterServices(this.value)"
                        class="w-full bg-[#0d1117] border border-[#30363d] rounded-md px-3 py-1.5 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-blue-500"
                    />
                </div>

                <button
                    hx-post="/homepage/refresh"
                    hx-target="#services-container"
                    hx-swap="outerHTML"
                    class="px-3 py-1.5 rounded-md text-sm bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] text-gray-200 transition-colors cursor-pointer"
                >
                    ↻ Refresh
                </button>

                <a
                    href="/dashboard"
                    class="px-3 py-1.5 rounded-md text-sm bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/40 text-blue-300 transition-colors"
                >
                    Bot Dashboard →
                </a>
            </div>
        </header>

        <!-- Services Grid -->
        <div th:replace="~{fragments/homepage-services :: services}"></div>
    </div>

    <script>
        function filterServices(query) {
            const term = query.trim().toLowerCase();
            const groups = document.querySelectorAll('[data-namespace-group]');
            groups.forEach(group => {
                const namespace = (group.getAttribute('data-namespace-group') || '').toLowerCase();
                const cards = group.querySelectorAll('[data-service-card]');
                let visibleCount = 0;

                cards.forEach(card => {
                    const searchText = (card.getAttribute('data-search') || '').toLowerCase();
                    const matches = !term || searchText.includes(term) || namespace.includes(term);
                    card.style.display = matches ? '' : 'none';
                    if (matches) visibleCount++;
                });

                group.style.display = visibleCount > 0 ? '' : 'none';
            });
        }

        document.body.addEventListener('htmx:afterSwap', () => {
            const input = document.getElementById('service-search');
            if (input && input.value) {
                filterServices(input.value);
            }
        });
    </script>
</body>
</html>
